name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform_key: x86_64-windows
            archive_name: rmod-x86_64-windows.zip
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            platform_key: aarch64-windows
            archive_name: rmod-aarch64-windows.zip
          # Future cross-platform targets can be uncommented/added here:
          # - target: x86_64-unknown-linux-gnu
          #   os: ubuntu-latest
          #   platform_key: x86_64-linux
          #   archive_name: rmod-x86_64-linux.tar.xz
          # - target: x86_64-apple-darwin
          #   os: macos-latest
          #   platform_key: x86_64-macos
          #   archive_name: rmod-x86_64-macos.tar.xz

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Disable Windows Defender real-time scanning
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
          if ($status.RealTimeProtectionEnabled) {
            Set-MpPreference -DisableRealtimeScanning $true
          }

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "v2-no-sccache"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Windows)
        shell: bash
        run: |
          ARCHIVE_NAME="${{ matrix.archive_name }}"
          mkdir -p package
          cp target/${{ matrix.target }}/release/rmod.exe package/
          cp README.md package/
          cp LICENSE package/
          cd package
          7z a ../$ARCHIVE_NAME *
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: Compute checksum
        shell: bash
        run: |
          if command -v sha256sum &>/dev/null; then
            echo "SHA256=$(sha256sum $ARCHIVE_NAME | cut -d' ' -f1)" >> $GITHUB_ENV
          elif command -v shasum &>/dev/null; then
            echo "SHA256=$(shasum -a 256 $ARCHIVE_NAME | cut -d' ' -f1)" >> $GITHUB_ENV
          else
            echo "SHA256=$(openssl dgst -sha256 $ARCHIVE_NAME | cut -d' ' -f2)" >> $GITHUB_ENV
          fi

      - name: Upload Artifact to Workflow
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts-${{ matrix.platform_key }}
          path: ${{ matrix.archive_name }}

      - name: Write checksum file
        shell: bash
        run: |
          echo "$SHA256  ${{ matrix.archive_name }}" > checksums-${{ matrix.platform_key }}.sha256

      - name: Upload Checksum File
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksum-files-${{ matrix.platform_key }}
          path: checksums-${{ matrix.platform_key }}.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        
      - name: Download all workflow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-artifacts-*
          path: artifacts
          merge-multiple: true

      - name: Download checksum files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: checksum-files-*
          path: checksums
          merge-multiple: true
          
      - name: Generate Manifest with Checksums
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          
          # Read checksums into variables
          windows_x86_64_sha256=$(grep "rmod-x86_64-windows.zip" checksums/*.sha256 2>/dev/null | cut -d' ' -f1 || echo "")
          windows_aarch64_sha256=$(grep "rmod-aarch64-windows.zip" checksums/*.sha256 2>/dev/null | cut -d' ' -f1 || echo "")
          
          python3 -c "
          import json, os
          version = '$VERSION'
          base_url = f'https://github.com/ereinaimer/rmod/releases/download/v{version}'
          manifest = {
              'version': version,
              'artifacts': {
                  'windows-x86_64': {
                      'url': f'{base_url}/rmod-x86_64-windows.zip',
                      'sha256': '$windows_x86_64_sha256'
                  },
                  'windows-aarch64': {
                      'url': f'{base_url}/rmod-aarch64-windows.zip',
                      'sha256': '$windows_aarch64_sha256'
                  },
              }
          }
          with open('manifest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          "
          
      - name: Create Release and Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          PRERELEASE=""
          if [[ "${VERSION}" == *-* ]]; then PRERELEASE="--prerelease"; fi
          gh release create $GITHUB_REF_NAME \
            ./artifacts/* \
            manifest.json \
            --title "v$VERSION" \
            --generate-notes \
            $PRERELEASE
